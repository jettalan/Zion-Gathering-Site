<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Liahona — Frequent Flyer Program flagship — $10,000, worldwide">
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="82%">
      <stop offset="0%" stop-color="#5C1F2E"/>
      <stop offset="55%" stop-color="#4A1820"/>
      <stop offset="100%" stop-color="#3D1320"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- premium inner pinstripe -->
  <rect x="34" y="34" width="1212" height="652" fill="none" stroke="#B08840" stroke-width="1" opacity="0.45"/>

  <!-- corner brackets (brighter gold) -->
  <g stroke="#C9A05A" stroke-width="1.6" fill="none" stroke-linecap="square">
    <path d="M 60 114 L 60 60 L 114 60"/>
    <path d="M 1166 60 L 1220 60 L 1220 114"/>
    <path d="M 60 606 L 60 660 L 114 660"/>
    <path d="M 1166 660 L 1220 660 L 1220 606"/>
  </g>

  <!-- eyebrow -->
  <text x="640" y="134" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="20" letter-spacing="7" fill="#C9A05A" font-weight="500">FREQUENT FLYER PROGRAM &#183; FLAGSHIP</text>

  <!-- icon: compass (the Liahona) -->
  <g transform="translate(640, 232)" fill="none">
    <circle cx="0" cy="0" r="50" stroke="#C9A05A" stroke-width="2"/>
    <circle cx="0" cy="0" r="40" stroke="#C9A05A" stroke-width="1" opacity="0.5"/>
    <!-- 4-point compass star -->
    <path d="M 0 -46 L 9 -9 L 46 0 L 9 9 L 0 46 L -9 9 L -46 0 L -9 -9 Z" fill="#C9A05A"/>
    <circle cx="0" cy="0" r="6" fill="#3D1320" stroke="#C9A05A" stroke-width="1.5"/>
  </g>

  <!-- title -->
  <text x="640" y="448" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif" font-size="130" fill="#F4ECDC" font-weight="500" letter-spacing="-1">Liahona</text>

  <!-- scope -->
  <text x="640" y="516" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="40" fill="#C9A05A" font-style="italic">Every gathering on earth</text>

  <!-- divider with diamond -->
  <g stroke="#C9A05A" stroke-width="1" fill="none">
    <line x1="498" y1="556" x2="600" y2="556"/>
    <line x1="680" y1="556" x2="782" y2="556"/>
  </g>
  <path d="M 640 546 L 652 556 L 640 566 L 628 556 Z" fill="#C9A05A"/>

  <!-- price -->
  <text x="640" y="624" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="38" fill="#F4ECDC" font-weight="500">$10,000<tspan fill="#C9A05A" font-style="italic" font-size="30">&#160;&#160;&#183;&#160;&#160;one-time</tspan></text>
</svg>
